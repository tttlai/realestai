<!doctype html>
<!--
  Source for facebook-cover.png (1640x624) and website/public/brokers/share.png (1200x630, add ?share).
  Phones crop the cover to the middle, so keep everything between x=270 and x=1370,
  and clear of the bottom left, where the profile picture sits on desktop.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..800&family=Mukta:wght@400;500;700&display=block" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        position: relative; width: 1640px; height: 624px; overflow: hidden;
        background: radial-gradient(760px 620px at 1230px 320px, #133a48, #0a192f 85%);
        color: #d5e0f5; font-family: "Mukta", "Segoe UI", sans-serif;
      }
      .copy { position: absolute; left: 290px; top: 92px; width: 570px; }
      .brand { color: #64ffda; font: 700 26px "Anek Latin"; letter-spacing: 0.06em; }
      h1 { margin-top: 18px; color: #f4f8ff; font: 700 70px/1.04 "Anek Latin"; font-stretch: 94%; letter-spacing: -0.005em; }
      h1 em { color: #64ffda; font-style: normal; }
      .small { margin-top: 24px; font-size: 27px; line-height: 1.35; }
      ul { position: absolute; left: 900px; top: 112px; width: 450px; display: grid; gap: 14px; list-style: none; }
      li { padding: 21px 26px; border-radius: 16px; background: #1b3350; color: #f4f8ff; font-size: 27px; line-height: 1.2; }
      li::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 18px; border-radius: 50%; background: #64ffda; }
      .share { width: 1200px; height: 630px; background: radial-gradient(700px 620px at 960px 320px, #133a48, #0a192f 85%); }
      .share .copy { left: 64px; top: 124px; width: 600px; }
      .share ul { left: 690px; top: 146px; width: 446px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <p class="brand">REALEST AI</p>
      <h1>Every property enquiry answered. <em>Day or night.</em></h1>
      <p class="small">A WhatsApp assistant for property brokers.<br />Free 14-day pilot for 3 Pune brokers.</p>
    </div>
    <ul>
      <li>English, Hindi and Hinglish</li>
      <li>Asks budget, area, timeline</li>
      <li>Quotes only your listings</li>
      <li>Alerts you to hot leads</li>
    </ul>
    <script>
      if (location.search === "?share") document.body.classList.add("share");
    </script>
  </body>
</html>
