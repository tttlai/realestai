[project]
name = "whatsapp-leads-bot"
version = "0.1.0"
description = "Realest AI WhatsApp lead-qualification bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
# The supabase/ migrations folder would otherwise make the SDK look first-party.
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
